name: CI - Testes automatizados

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Testes com Node.js
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Usamos npm install porque o package-lock.json enviado nao parece
      # estar sincronizado com as dependencias atuais do package.json.
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Executar testes automatizados
        run: npm test
